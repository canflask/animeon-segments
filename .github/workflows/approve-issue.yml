name: Принятие таймкода

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write

concurrency:
  group: approve-segment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    name: Add approved segment
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Получить основную ветку
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Подключить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Импортировать, проверить и сохранить базу
        id: import
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "animeon-skip-bot"
          git config user.email "animeon-skip-bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Попытка ${attempt}: получаю свежую ветку main"
            git fetch origin main
            git checkout -B main origin/main

            node scripts/import-issue.mjs
            npm run validate
            git add data/segments.json

            if git diff --cached --quiet; then
              echo "Изменений нет"
              exit 0
            fi

            git commit -m "segments: approve issue #${ISSUE_NUMBER}"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Ветка main изменилась во время обработки. Повторяю на свежей версии."
            sleep $((attempt * 2))
          done

          echo "Не удалось сохранить базу после 5 попыток" >&2
          exit 1

      - name: Закрыть обработанное Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION_RESULT: ${{ steps.import.outputs.action }}
        run: gh issue close "${ISSUE_NUMBER}" --comment "Таймкод проверен и автоматически ${ACTION_RESULT} в базу."
