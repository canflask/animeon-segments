name: Предложить таймкод
description: Новая или исправленная метка опенинга/эндинга
title: "[Таймкод] "
body:
  - type: markdown
    attributes:
      value: |
        Быстрее всего создать предложение кнопкой «Отправить через GitHub» в AnimeOn Toolbox.

  - type: input
    id: anime_url
    attributes:
      label: Ссылка на страницу AnimeOn
      placeholder: https://animeon.cc/anime/название-12345
    validations:
      required: true

  - type: input
    id: episode
    attributes:
      label: Номер серии
      placeholder: "1"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Категория
      options:
        - opening
        - ending
    validations:
      required: true

  - type: input
    id: range
    attributes:
      label: Начало и конец
      description: В секундах или формате ММ:СС
      placeholder: 75.20 — 164.80
    validations:
      required: true

  - type: input
    id: translation
    attributes:
      label: Озвучка
      description: Оставьте *, если таймкод подходит для всех озвучек
      value: "*"
    validations:
      required: true

  - type: textarea
    id: json
    attributes:
      label: JSON из скрипта
      description: Вставьте объект, созданный вкладкой «Пропуск»
      render: json

  - type: checkboxes
    id: confirmation
    attributes:
      label: Проверка
      options:
        - label: Я проверил начало и конец на видео
          required: true
