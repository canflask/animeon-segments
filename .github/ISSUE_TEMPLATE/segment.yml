name: Предложить таймкод
description: Новые или исправленные метки опенинга и эндинга
title: "[Таймкоды OP + ED] "
body:
  - type: markdown
    attributes:
      value: |
        Быстрее всего создать предложение кнопкой «Отправить через GitHub» в AnimeOn Toolbox.

  - type: input
    id: anime_url
    attributes:
      label: Ссылка на страницу AnimeOn
      placeholder: https://animeon.cc/anime/название-12345
    validations:
      required: true

  - type: input
    id: episode
    attributes:
      label: Номер серии
      placeholder: "1"
    validations:
      required: true

  - type: input
    id: opening_range
    attributes:
      label: Начало и конец опенинга
      description: В секундах или формате ММ:СС
      placeholder: 75.20 — 164.80
    validations:
      required: true

  - type: input
    id: ending_range
    attributes:
      label: Начало и конец эндинга
      description: В секундах или формате ММ:СС
      placeholder: 1320.00 — 1410.00
    validations:
      required: true

  - type: input
    id: translation
    attributes:
      label: Озвучка
      description: Оставьте *, если таймкод подходит для всех озвучек
      value: "*"
    validations:
      required: true

  - type: textarea
    id: json
    attributes:
      label: JSON из скрипта
      description: Вставьте единый массив OP + ED, созданный вкладкой «Пропуск»
      render: json

  - type: checkboxes
    id: confirmation
    attributes:
      label: Проверка
      options:
        - label: Я проверил границы опенинга и эндинга на видео
          required: true
